[package]
name = "sirius-desktop"
version = "0.1.0"
description = "Sirius third-party 115 desktop client"
authors = ["Sirius Contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sirius_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libmpv2 = { version = "6.0.0", default-features = false, features = ["render"] }
tauri-plugin-dialog = "2"
glutin = "0.32.3"
raw-window-handle = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
hmac = "0.12"
httpdate = "1"
qrcode = "0.14"
sha1 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "time"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
