<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sirius 品牌备援视觉">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1526"/>
      <stop offset=".5" stop-color="#12233f"/>
      <stop offset="1" stop-color="#1c3a6e"/>
    </linearGradient>
    <radialGradient id="glow-a" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4078ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4078ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx=".5" cy=".5" r=".5">
