  <circle cx="510" cy="780" r="280" fill="url(#glow-b)"/>
  <rect width="600" height="900" fill="url(#veil)"/>
  <g fill="none" stroke="rgba(214,228,255,.42)" stroke-width="6">
    <rect x="220" y="386" width="160" height="128" rx="18"/>
